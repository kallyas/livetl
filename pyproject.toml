[project]
name = "livetl"
version = "0.1.0"
description = "Realtime speech translation for live streams (Twitch/YouTube) -> subtitles"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "silero-vad>=5.1",
    "torch>=2.2",
    "requests>=2.31",
    "websockets>=12",
    "rich>=13.7",
    "streamlink>=6.7",
    "yt-dlp>=2024.4.9",
]

[project.optional-dependencies]
# Apple Silicon GPU ASR (fastest on M-series).
# numba is pinned up: mlx-whisper leaves it unbounded and resolvers happily
# backtrack to 0.53, which refuses to build on Python >= 3.10.
mlx = ["mlx-whisper>=0.4", "numba>=0.60"]
# Portable CPU ASR (CTranslate2 int8)
ct2 = ["faster-whisper>=1.0"]
# NVIDIA server ASR. CTranslate2 4.x links against cuDNN 9; the pip wheels
# save you from matching a system CUDA install.
cuda = [
    "faster-whisper>=1.0",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9.0,<10",
]
# Local machine translation (Marian / NLLB)
localmt = ["transformers>=4.40", "sentencepiece>=0.2", "sacremoses>=0.1"]

[project.scripts]
livetl = "livetl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livetl"]
